<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image.png" sizes="32x32" href="assets/images/favicon-32x32.png">
  <title>Frontend Mentor | Blog preview card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="content">
      <div class="picture">
        <img src="assets/images/illustration-article.svg" alt="Illustration of the article">
      </div>
      <div class="l-tag">
        <small class="learn">Learning</small>
      </div>
      <div class="date">
        <p>Publish 21 Dec 2023</p>
      </div>
      <div class="heading">
        <h1>HTML & CSS foundations</h1>
      </div>
      <div class="description">
        <p>These languages are the backbone of every website, defining structure, content and presentation.</p>
      </div>
      <div class="greg">
        <img src="assets/images/image-avatar.webp" alt="Greg hooper">
        <h4>Greg Hooper</h4>
      </div>
    </div>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Ariba Baig</a>.
  </footer>
</body>
</html>
